<script type="module">
await new Promise(r=>setTimeout(r,250));
const $=id=>document.getElementById(id),s=$('system'),a=$('electro-anode'),cell=$('electro-cell'),errors=[],rows=[];
for(let i=0;i<s.options.length;i++){
 a.value='';s.selectedIndex=i;s.dispatchEvent(new Event('change'));
 let supported=0,limited=0,ionCount=0;
 for(const opt of a.options){
  a.value=opt.value;a.dispatchEvent(new Event('change'));
  if($('electro-detail').textContent.includes('Chưa mô phỏng')){
    limited++;if(!$('electro-start').disabled||cell.dataset.running!=='false')errors.push('tổ hợp '+i+' '+opt.value);continue;
  }
  supported++;$('electro-start').click();
  if(cell.dataset.running!=='true')errors.push('không chạy '+i);
  const ions=[...cell.querySelectorAll('.electro-ion')];ionCount=ions.length;
  for(const ion of ions){
    const style=getComputedStyle(ion),drift=parseFloat(style.getPropertyValue('--ion-drift'));
    if(style.animationName!=='gdvn-ion-drift'||(ion.classList.contains('electro-cation')?drift>=0:drift<=0))errors.push('ion '+i);
  }
  $('electro-reset').click();
  if(cell.dataset.running!=='false'||[...cell.querySelectorAll('.electro-ion')].some(ion=>getComputedStyle(ion).animationName!=='none'))errors.push('reset '+i);
 }
 rows.push({system:s.options[i].textContent,supported,limited,ionCount});
}
a.value='';s.selectedIndex=8;s.dispatchEvent(new Event('change'));$('electro-start').click();
const ion=cell.querySelector('.electro-cation'),animation=ion.getAnimations()[0];
animation.pause();animation.currentTime=500;const x1=ion.getBoundingClientRect().x;
animation.currentTime=1800;const x2=ion.getBoundingClientRect().x;
if(!(x2<x1))errors.push('Cu(NO₃)₂: cation không dịch trái');
$('electro-view-right').click();
if(cell.style.getPropertyValue('--electro-angle')!=='15deg')errors.push('góc nghiêng');
$('faraday').click();$('thickness').click();
if(!$('thickness-result').textContent.includes('µm'))errors.push('Faraday');
const p=document.createElement('pre');p.id='qa-ion';p.textContent=JSON.stringify({rows,errors,measuredCopperShift:Math.round((x2-x1)*10)/10});document.body.append(p);
</script></body>
